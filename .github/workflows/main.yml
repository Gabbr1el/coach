name: Build Coach for Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  validate:
    name: Validate Coach
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bubblewrap \
            python3 \
            gcc \
            default-jdk \
            util-linux

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  package-windows:
    name: Package Windows
    runs-on: windows-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build Coach
        run: pnpm build

      - name: Rebuild native dependencies for Electron
        run: pnpm exec electron-builder install-app-deps

      - name: Package Windows installer
        run: pnpm exec electron-builder --win nsis --x64

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Coach-Windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
